name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PROJECT_NAME: shopmart
  TF_IN_AUTOMATION: "true"

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------
  # Phase 1: Tests (unit + integration, frontend + backend)
  # ------------------------------------------------------------
  test:
    name: Phase 1 - Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install backend deps
        working-directory: ./server
        run: npm ci

      - name: Lint backend
        working-directory: ./server
        run: npm run lint

      - name: Run backend unit + integration tests
        working-directory: ./server
        run: npm test

      - name: Install frontend deps
        working-directory: ./client
        run: npm ci

      - name: Lint frontend
        working-directory: ./client
        run: npm run lint

      - name: Run frontend tests
        working-directory: ./client
        run: npm test

      - name: Build frontend
        working-directory: ./client
        run: npm run build

      - name: Upload backend coverage report
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage
          if-no-files-found: warn

  # ------------------------------------------------------------
  # Phase 2: Terraform Apply
  # ------------------------------------------------------------
  terraform:
    name: Phase 2 - Terraform Apply
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    outputs:
      ecr_repository_url: ${{ steps.tf_outputs.outputs.ecr_repository_url }}
      ecs_cluster_name:   ${{ steps.tf_outputs.outputs.ecs_cluster_name }}
      ecs_service_name:   ${{ steps.tf_outputs.outputs.ecs_service_name }}
      s3_bucket_name:     ${{ steps.tf_outputs.outputs.s3_bucket_name }}
      log_group:          ${{ steps.tf_outputs.outputs.log_group }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan -var "aws_region=${{ secrets.AWS_REGION }}"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Export Terraform outputs
        id: tf_outputs
        run: |
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "ecs_cluster_name=$(terraform output -raw ecs_cluster_name)"     >> "$GITHUB_OUTPUT"
          echo "ecs_service_name=$(terraform output -raw ecs_service_name)"     >> "$GITHUB_OUTPUT"
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)"         >> "$GITHUB_OUTPUT"
          echo "log_group=$(terraform output -raw log_group)"                   >> "$GITHUB_OUTPUT"

      - name: Persist Terraform state
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: |
            terraform/terraform.tfstate
            terraform/terraform.tfstate.backup
            terraform/.terraform.lock.hcl
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------------------
  # Phase 3: Build & Push Docker image, then Deploy to ECS
  # ------------------------------------------------------------
  build-and-deploy:
    name: Phase 3 - Build, Push, Deploy
    needs: terraform
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REPO_URL: ${{ needs.terraform.outputs.ecr_repository_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REPO_URL:latest" \
            -t "$ECR_REPO_URL:$IMAGE_TAG" \
            .
          docker push "$ECR_REPO_URL:latest"
          docker push "$ECR_REPO_URL:$IMAGE_TAG"

      - name: Force new ECS deployment
        env:
          CLUSTER: ${{ needs.terraform.outputs.ecs_cluster_name }}
          SERVICE: ${{ needs.terraform.outputs.ecs_service_name }}
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment \
            > /dev/null

      - name: Wait for service to stabilize
        env:
          CLUSTER: ${{ needs.terraform.outputs.ecs_cluster_name }}
          SERVICE: ${{ needs.terraform.outputs.ecs_service_name }}
        run: |
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE"

      - name: Verify ECS service is running
        env:
          CLUSTER: ${{ needs.terraform.outputs.ecs_cluster_name }}
          SERVICE: ${{ needs.terraform.outputs.ecs_service_name }}
        run: |
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].status' --output text)
          RUNNING=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].runningCount' --output text)
          DESIRED=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].desiredCount' --output text)
          echo "Service $SERVICE: status=$STATUS running=$RUNNING desired=$DESIRED"
          test "$STATUS" = "ACTIVE"
          test "$RUNNING" = "$DESIRED"
          test "$RUNNING" -ge 1
          echo "ECS service is healthy."

      - name: Print public task endpoint
        env:
          CLUSTER: ${{ needs.terraform.outputs.ecs_cluster_name }}
          SERVICE: ${{ needs.terraform.outputs.ecs_service_name }}
        run: |
          TASK_ARN=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" --query 'taskArns[0]' --output text)
          if [ "$TASK_ARN" = "None" ] || [ -z "$TASK_ARN" ]; then
            echo "No running task found."
            exit 0
          fi
          ENI=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value | [0]' --output text)
          PUBLIC_IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI" \
            --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
          echo "App reachable at: http://$PUBLIC_IP:5001/api/health"
