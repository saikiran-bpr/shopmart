name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PROJECT_NAME: shopmart
  TF_IN_AUTOMATION: "true"

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------
  # Phase 1: Tests (unit + integration, frontend + backend)
  # ------------------------------------------------------------
  test:
    name: Phase 1 - Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install backend deps
        working-directory: ./server
        run: npm ci

      - name: Lint backend
        working-directory: ./server
        run: npm run lint

      - name: Run backend unit + integration tests
        working-directory: ./server
        run: npm test

      - name: Install frontend deps
        working-directory: ./client
        run: npm ci

      - name: Lint frontend
        working-directory: ./client
        run: npm run lint

      - name: Run frontend tests
        working-directory: ./client
        run: npm test

      - name: Build frontend
        working-directory: ./client
        run: npm run build

      - name: Upload backend coverage report
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage
          if-no-files-found: warn

  # ------------------------------------------------------------
  # Phase 2: Terraform Apply
  # ------------------------------------------------------------
  terraform:
    name: Phase 2 - Terraform Apply
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    outputs:
      ecr_repository_url: ${{ steps.tf_outputs.outputs.ecr_repository_url }}
      ecs_cluster_name:   ${{ steps.tf_outputs.outputs.ecs_cluster_name }}
      ecs_service_name:   ${{ steps.tf_outputs.outputs.ecs_service_name }}
      s3_bucket_name:     ${{ steps.tf_outputs.outputs.s3_bucket_name }}
      log_group:          ${{ steps.tf_outputs.outputs.log_group }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Bootstrap Terraform state bucket (idempotent)
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="shopmart-tfstate-$ACCOUNT_ID"
          STATE_KEY="shopmart/terraform.tfstate"
          REGION="$AWS_REGION"

          echo "TF_STATE_BUCKET=$STATE_BUCKET" >> "$GITHUB_ENV"
          echo "TF_STATE_KEY=$STATE_KEY"       >> "$GITHUB_ENV"
          echo "ACCOUNT_ID=$ACCOUNT_ID"        >> "$GITHUB_ENV"
          echo "State bucket: $STATE_BUCKET"

          if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "State bucket already exists."
          else
            echo "Creating state bucket..."
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$STATE_BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            echo "State bucket bootstrapped."
          fi

      - name: Clean up orphan AWS resources (only when state is empty)
        shell: bash
        run: |
          set +e
          # If state object already exists, skip cleanup — Terraform owns these resources now.
          if aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$TF_STATE_KEY" >/dev/null 2>&1; then
            echo "Terraform state already exists — skipping orphan cleanup."
            exit 0
          fi

          echo "No prior state. Cleaning up any orphan shopmart-* resources from previous failed runs..."

          # ECS: stop tasks, scale services to 0, delete services, then cluster
          for CLUSTER in shopmart-cluster; do
            if aws ecs describe-clusters --clusters "$CLUSTER" --region "$AWS_REGION" --query 'clusters[?status==`ACTIVE`]' --output text 2>/dev/null | grep -q .; then
              for SVC in $(aws ecs list-services --cluster "$CLUSTER" --region "$AWS_REGION" --query 'serviceArns[]' --output text 2>/dev/null); do
                aws ecs update-service --cluster "$CLUSTER" --service "$SVC" --desired-count 0 --region "$AWS_REGION" >/dev/null 2>&1
                aws ecs delete-service --cluster "$CLUSTER" --service "$SVC" --force --region "$AWS_REGION" >/dev/null 2>&1
              done
              aws ecs delete-cluster --cluster "$CLUSTER" --region "$AWS_REGION" >/dev/null 2>&1 && echo "Deleted ECS cluster $CLUSTER"
            fi
          done

          # ECR
          aws ecr delete-repository --repository-name shopmart --force --region "$AWS_REGION" >/dev/null 2>&1 \
            && echo "Deleted ECR repo shopmart"

          # CloudWatch logs
          aws logs delete-log-group --log-group-name /ecs/shopmart --region "$AWS_REGION" >/dev/null 2>&1 \
            && echo "Deleted log group /ecs/shopmart"

          # Security group (must not be attached — at this point ECS service is gone)
          SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=shopmart-sg \
            --query 'SecurityGroups[0].GroupId' --output text --region "$AWS_REGION" 2>/dev/null)
          if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
            aws ec2 delete-security-group --group-id "$SG_ID" --region "$AWS_REGION" >/dev/null 2>&1 \
              && echo "Deleted security group $SG_ID"
          fi

          # Stranded random-suffixed app S3 buckets (NOT the state bucket)
          for B in $(aws s3 ls 2>/dev/null | awk '{print $3}' | grep -E "^shopmart-${ACCOUNT_ID}-" | grep -v tfstate); do
            aws s3 rb "s3://$B" --force >/dev/null 2>&1 && echo "Deleted bucket $B"
          done

          echo "Orphan cleanup complete."
          exit 0

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan -var "aws_region=$AWS_REGION"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show all Terraform outputs (debug)
        run: terraform output

      - name: Export Terraform outputs
        id: tf_outputs
        shell: bash
        run: |
          set -euo pipefail

          capture() {
            local name="$1"
            local value
            value="$(terraform output -raw "$name")"
            if [ -z "$value" ]; then
              echo "ERROR: terraform output '$name' is empty" >&2
              terraform output >&2 || true
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_OUTPUT"
            echo "$name=$value"
          }

          capture ecr_repository_url
          capture ecs_cluster_name
          capture ecs_service_name
          capture s3_bucket_name
          capture log_group

  # ------------------------------------------------------------
  # Phase 3: Build & Push Docker image, then Deploy to ECS
  # ------------------------------------------------------------
  build-and-deploy:
    name: Phase 3 - Build, Push, Deploy
    needs: terraform
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify upstream outputs are present
        env:
          ECR_REPO_URL: ${{ needs.terraform.outputs.ecr_repository_url }}
          CLUSTER:      ${{ needs.terraform.outputs.ecs_cluster_name }}
          SERVICE:      ${{ needs.terraform.outputs.ecs_service_name }}
        run: |
          set -euo pipefail
          missing=0
          for var in ECR_REPO_URL CLUSTER SERVICE; do
            if [ -z "${!var}" ]; then
              echo "ERROR: $var is empty (terraform job did not export it)" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Build, tag, and push image
        env:
          ECR_REPO_URL: ${{ needs.terraform.outputs.ecr_repository_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            -t "$ECR_REPO_URL:latest" \
            -t "$ECR_REPO_URL:$IMAGE_TAG" \
            .
          docker push "$ECR_REPO_URL:latest"
          docker push "$ECR_REPO_URL:$IMAGE_TAG"

      - name: Force new ECS deployment
        env:
          CLUSTER: ${{ needs.terraform.outputs.ecs_cluster_name }}
          SERVICE: ${{ needs.terraform.outputs.ecs_service_name }}
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment \
            > /dev/null

      - name: Wait for service to stabilize
        env:
          CLUSTER: ${{ needs.terraform.outputs.ecs_cluster_name }}
          SERVICE: ${{ needs.terraform.outputs.ecs_service_name }}
        run: |
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE"

      - name: Verify ECS service is running
        env:
          CLUSTER: ${{ needs.terraform.outputs.ecs_cluster_name }}
          SERVICE: ${{ needs.terraform.outputs.ecs_service_name }}
        run: |
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].status' --output text)
          RUNNING=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].runningCount' --output text)
          DESIRED=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].desiredCount' --output text)
          echo "Service $SERVICE: status=$STATUS running=$RUNNING desired=$DESIRED"
          test "$STATUS" = "ACTIVE"
          test "$RUNNING" = "$DESIRED"
          test "$RUNNING" -ge 1
          echo "ECS service is healthy."

      - name: Print public task endpoint
        env:
          CLUSTER: ${{ needs.terraform.outputs.ecs_cluster_name }}
          SERVICE: ${{ needs.terraform.outputs.ecs_service_name }}
        run: |
          TASK_ARN=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" --query 'taskArns[0]' --output text)
          if [ "$TASK_ARN" = "None" ] || [ -z "$TASK_ARN" ]; then
            echo "No running task found."
            exit 0
          fi
          ENI=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value | [0]' --output text)
          PUBLIC_IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI" \
            --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
          echo "App reachable at: http://$PUBLIC_IP:5001/api/health"
