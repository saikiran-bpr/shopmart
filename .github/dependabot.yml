version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "bompelliwarsaikiran"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    pull-request-branch-name:
      separator: "/"

  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "bompelliwarsaikiran"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    pull-request-branch-name:
      separator: "/"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
